version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: gosuslugi_bot
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d gosuslugi_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    command: python -m bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bot:secretpassword@db:5432/gosuslugi_bot
      - AUTH_SERVER_URL=http://auth_server:8081

  auth_server:
    build: .
    command: python -m auth_server.server
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bot:secretpassword@db:5432/gosuslugi_bot
    volumes:
      - ./generated_sites:/app/generated_sites
  
  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    environment:
      - NGROK_AUTHTOKEN=3FY1FYc3ZMqeEwyKmqpfLdSdc4I_65Bpowou2zdcDZX7YAzk8
    command:
      - "http"
      - "auth_server:8081"
    depends_on:
      - auth_server

volumes:
  pgdata:
